<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="header"></header>

    <main class="divider">
      <h2>Review & Place Your Order</h2>

      <div class="checkout-container">
        <!-- Checkout Form -->
        <form name="checkout" id="checkout-form">
          <fieldset>
            <legend>Shipping Information</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required />

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required />

            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State</label>
            <input type="text" id="state" name="state" required />

            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" required />
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" value="1234123412341234" required />

            <label for="expiration">Expiration Date (MM/YY)</label>
            <input type="text" id="expiration" name="expiration" value="12/28" required />

            <label for="code">Security Code (CVV)</label>
            <input type="text" id="code" name="code" value="123" required />
          </fieldset>

          <button id="checkoutSubmit" type="submit">Submit Order</button>
        </form>

        <!-- Order Summary Section -->
        <fieldset class="order-summary" id="order-summary">
          <legend>Order Summary</legend>
          <p>Item Subtotal (<span id="num-items">0</span>): <span id="subtotal">$0.00</span></p>
          <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
          <p>Tax (6%): <span id="tax">$0.00</span></p>
          <h4>Order Total: <span id="orderTotal">$0.00</span></h4>
        </fieldset>
      </div>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
