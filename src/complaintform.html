<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Customer Complaint</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="js/main.js" type="module"></script>
    <script src="js/complaint.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header"></header>

    <main class="divider">
      <section class="complaint-container">
        <h1>Customer Complaint Form</h1>
        <p class="complaint-intro">
          We apologize if your experience was anything less than satisfactory. Please fill out the form below so our support team can resolve your issue as quickly as possible.
        </p>

        <form id="complaint-form" class="complaint-form">
          <div class="form-field">
            <label for="complaint-name">Full Name <span class="required">*</span></label>
            <input type="text" id="complaint-name" name="name" required placeholder="Jane Doe" />
          </div>

          <div class="form-field">
            <label for="complaint-email">Email Address <span class="required">*</span></label>
            <input type="email" id="complaint-email" name="email" required placeholder="jane.doe@example.com" />
          </div>

          <div class="form-field">
            <label for="complaint-order">Order Number <em>(Optional)</em></label>
            <input type="text" id="complaint-order" name="orderNumber" placeholder="e.g. #SO-98765" />
          </div>

          <div class="form-field">
            <label for="complaint-category">Type of Complaint <span class="required">*</span></label>
            <select id="complaint-category" name="category" required>
              <option value="" disabled selected>Select an issue...</option>
              <option value="damaged-item">Damaged or Defective Product</option>
              <option value="shipping">Shipping or Delivery Delay</option>
              <option value="incorrect-order">Received Wrong Item</option>
              <option value="billing">Billing or Payment Issue</option>
              <option value="customer-service">Customer Support Service</option>
              <option value="other">Other Issue</option>
            </select>
          </div>

          <div class="form-field">
            <label for="complaint-details">Complaint Details <span class="required">*</span></label>
            <textarea id="complaint-details" name="details" rows="5" required placeholder="Describe what went wrong in detail..."></textarea>
          </div>

          <div class="form-field">
            <label for="complaint-resolution">Desired Resolution <span class="required">*</span></label>
            <select id="complaint-resolution" name="resolution" required>
              <option value="" disabled selected>Select preferred outcome...</option>
              <option value="refund">Full or Partial Refund</option>
              <option value="replacement">Item Replacement</option>
              <option value="store-credit">Store Credit / Voucher</option>
              <option value="follow-up">Direct Call / Email Explanation</option>
            </select>
          </div>

          <button type="submit" id="complaint-submit-btn" class="submit-btn">Submit Complaint</button>
          <p id="complaint-response" class="complaint-response" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
